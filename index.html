<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>智哥通運｜管理系統</title><style>body{font-family:Arial,'Microsoft JhengHei',sans-serif;background:#f3f6fa;color:#223;margin:0}header{background:#183b59;color:white;padding:20px}main{max-width:1200px;margin:auto;padding:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{background:#176e9b;color:white;border:0;border-radius:6px;padding:9px 14px;cursor:pointer}button.secondary{background:#667788}button.danger{background:#aa3b3b}.panel{background:white;padding:18px;border-radius:10px;margin:12px 0;box-shadow:0 2px 9px #0001}.hidden{display:none}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}label{display:flex;flex-direction:column;gap:5px;font-size:14px}input,select{padding:9px;border:1px solid #c9d1da;border-radius:5px;font:inherit;min-width:0}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{border-bottom:1px solid #ddd;padding:9px;text-align:left}th{background:#edf3f7}.muted{color:#667}h2{margin-top:0}small{color:#d8e5ed}</style></head><body><header><h1>智哥通運｜管理系統</h1><small>全新獨立資料庫（本機測試版）</small></header><main><div class="panel"><b>測試版說明：</b>目前資料僅儲存在此瀏覽器，尚未連接雲端帳號與同步服務。正式手機／電腦同步需另外設定專屬後端與登入權限。<p><button onclick="backup()">匯出資料備份 JSON</button> <label style="display:inline-block">匯入備份 <input type="file" accept="application/json" onchange="restore(event)"></label></p></div><nav><button onclick="tab('people')">客戶／司機</button><button onclick="tab('trips')">趟次結算</button><button onclick="tab('invoice')">請款單</button></nav><section id="people"><div class="panel"><h2>新增／修改客戶</h2><form id="customerForm" onsubmit="saveCustomer(event)"><div class="fields"><label>客戶名稱<input id="cname" required></label><label>電話<input id="cphone"></label><label>統一編號<input id="ctax"></label><label>地址<input id="caddress"></label></div><p><button>儲存客戶</button> <button type="button" class="secondary" onclick="resetCustomer()">取消修改</button></p></form><div class="scroll"><table><thead><tr><th>客戶</th><th>電話</th><th>統編</th><th>地址</th><th>操作</th></tr></thead><tbody id="customers"></tbody></table></div></div><div class="panel"><h2>新增／修改司機</h2><form onsubmit="saveDriver(event)"><div class="fields"><label>司機姓名<input id="dname" required></label><label>電話<input id="dphone"></label><label>車牌<input id="dplate"></label><label>備註<input id="dnote"></label></div><p><button>儲存司機</button> <button type="button" class="secondary" onclick="resetDriver()">取消修改</button></p></form><div class="scroll"><table><thead><tr><th>姓名</th><th>電話</th><th>車牌</th><th>備註</th><th>操作</th></tr></thead><tbody id="drivers"></tbody></table></div></div></section><section id="trips" class="hidden"><div class="panel"><h2>新增／修改趟次</h2><form onsubmit="saveTrip(event)"><div class="fields"><label>日期<input id="tdate" type="date" required></label><label>時間<input id="ttime" type="time"></label><label>司機<select id="tdriver" required></select></label><label>客戶<select id="tcustomer" required></select></label><label>台數<input id="tunits" type="number" step="any"></label><label>寄倉天數<input id="tdays" type="number" step="any"></label><label>組數<input id="tgroups" type="number" step="any"></label><label>噸數<input id="ttons" type="number" step="any"></label><label>廠商<input id="tvendor"></label><label>地點<input id="tplace"></label><label>運費<input id="tfee" type="number" step="any" required></label><label>收現<input id="tcash" type="number" step="any"></label><label>油資<input id="tfuel" type="number" step="any"></label><label>備註<input id="tnote"></label></div><p><button>儲存趟次</button> <button type="button" class="secondary" onclick="resetTrip()">取消修改</button></p></form></div><div class="panel"><h2>趟次紀錄</h2><div class="fields"><label>開始日期<input id="from" type="date" onchange="renderTrips()"></label><label>結束日期<input id="to" type="date" onchange="renderTrips()"></label><label>司機篩選<select id="filterDriver" onchange="renderTrips()"></select></label></div><p id="tripTotal"></p><div class="scroll"><table><thead><tr><th>日期</th><th>時間</th><th>司機</th><th>客戶</th><th>台數</th><th>寄倉天數</th><th>組數</th><th>噸數</th><th>廠商</th><th>地點</th><th>運費</th><th>收現</th><th>油資</th><th>備註</th><th>操作</th></tr></thead><tbody id="tripsList"></tbody></table></div></div></section><section id="invoice" class="hidden"><div class="panel"><h2>請款單（自動連動趟次）</h2><div class="fields"><label>請款客戶<select id="icustomer" onchange="renderInvoice()"></select></label><label>開始日期<input id="ifrom" type="date" onchange="renderInvoice()"></label><label>結束日期<input id="ito" type="date" onchange="renderInvoice()"></label></div><p><button onclick="window.print()">列印／另存 PDF</button> <button onclick="exportInvoice()">下載 CSV</button></p><h2>智哥通運　請款單</h2><p id="invoiceCustomer"></p><div class="scroll"><table><thead><tr><th>項次</th><th>日期</th><th>噸數</th><th>運送廠商／地點</th><th>金額</th></tr></thead><tbody id="invoiceRows"></tbody></table></div><h3 id="invoiceTotal"></h3></div></section></main><script>
const KEY='zhige_transport_v1';let data=JSON.parse(localStorage.getItem(KEY)||'{"customers":[],"drivers":[],"trips":[]}');let editC=null,editD=null,editT=null;const $=id=>document.getElementById(id),v=id=>$(id).value,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('zh-TW'),id=()=>crypto.randomUUID(),persist=()=>{localStorage.setItem(KEY,JSON.stringify(data));render()};function tab(name){for(const x of ['people','trips','invoice'])$(x).classList.toggle('hidden',x!==name)}function options(el,arr,all=false){const old=el.value;el.innerHTML=(all?'<option value="">全部司機</option>':'<option value="">請選擇</option>')+arr.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');el.value=old}function render(){options($('tdriver'),data.drivers);options($('filterDriver'),data.drivers,true);options($('tcustomer'),data.customers);options($('icustomer'),data.customers);$('customers').innerHTML=data.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.tax)}</td><td>${esc(x.address)}</td><td><button onclick="editCustomer('${x.id}')">修改</button> <button class="danger" onclick="remove('customers','${x.id}')">刪除</button></td></tr>`).join('');$('drivers').innerHTML=data.drivers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.phone)}</td><td>${esc(x.plate)}</td><td>${esc(x.note)}</td><td><button onclick="editDriver('${x.id}')">修改</button> <button class="danger" onclick="remove('drivers','${x.id}')">刪除</button></td></tr>`).join('');renderTrips();renderInvoice()}function saveCustomer(e){e.preventDefault();const x={id:editC||id(),name:v('cname'),phone:v('cphone'),tax:v('ctax'),address:v('caddress')};upsert('customers',x);resetCustomer();persist()}function saveDriver(e){e.preventDefault();const x={id:editD||id(),name:v('dname'),phone:v('dphone'),plate:v('dplate'),note:v('dnote')};upsert('drivers',x);resetDriver();persist()}function upsert(type,x){const i=data[type].findIndex(y=>y.id===x.id);if(i<0)data[type].unshift(x);else data[type][i]=x}function resetCustomer(){editC=null;$('customerForm').reset()}function resetDriver(){editD=null;['dname','dphone','dplate','dnote'].forEach(k=>$(k).value='')}function editCustomer(k){const x=data.customers.find(y=>y.id===k);editC=k;for(const [a,b] of [['cname','name'],['cphone','phone'],['ctax','tax'],['caddress','address']])$(a).value=x[b]||'';tab('people');window.scrollTo(0,0)}function editDriver(k){const x=data.drivers.find(y=>y.id===k);editD=k;for(const [a,b] of [['dname','name'],['dphone','phone'],['dplate','plate'],['dnote','note']])$(a).value=x[b]||'';tab('people');window.scrollTo(0,0)}function remove(type,k){if(type!=='trips'&&data.trips.some(t=>t[type==='customers'?'customer':'driver']===k)){alert('已有趟次使用此資料，請先調整趟次');return}if(confirm('確定刪除？')){data[type]=data[type].filter(x=>x.id!==k);persist()}}const fields=['date','time','driver','customer','units','days','groups','tons','vendor','place','fee','cash','fuel','note'];function saveTrip(e){e.preventDefault();const x={id:editT||id()};for(const k of fields)x[k]=v('t'+k);upsert('trips',x);resetTrip();persist()}function resetTrip(){editT=null;fields.forEach(k=>$('t'+k).value='')}function editTrip(k){const x=data.trips.find(y=>y.id===k);editT=k;for(const p of fields)$('t'+p).value=x[p]||'';tab('trips');window.scrollTo(0,0)}function name(type,k){return data[type].find(x=>x.id===k)?.name||'(已刪除)'}function renderTrips(){let rows=data.trips.filter(x=>(!v('from')||x.date>=v('from'))&&(!v('to')||x.date<=v('to'))&&(!v('filterDriver')||x.driver===v('filterDriver')));$('tripTotal').textContent=`共 ${rows.length} 趟｜運費合計 ${money(rows.reduce((a,x)=>a+Number(x.fee||0),0))}`;$('tripsList').innerHTML=rows.map(x=>`<tr>${['date','time','driver','customer','units','days','groups','tons','vendor','place','fee','cash','fuel','note'].map(k=>`<td>${esc(k==='driver'?name('drivers',x[k]):k==='customer'?name('customers',x[k]):x[k])}</td>`).join('')}<td><button onclick="editTrip('${x.id}')">修改</button> <button class="danger" onclick="remove('trips','${x.id}')">刪除</button></td></tr>`).join('')}function invoiceData(){return data.trips.filter(x=>x.customer===v('icustomer')&&(!v('ifrom')||x.date>=v('ifrom'))&&(!v('ito')||x.date<=v('ito'))).sort((a,b)=>a.date.localeCompare(b.date))}function renderInvoice(){const rows=invoiceData();$('invoiceCustomer').textContent='客戶：'+name('customers',v('icustomer'));$('invoiceRows').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.date)}</td><td>${esc(x.tons||'-')}</td><td>${esc([x.vendor,x.place].filter(Boolean).join('／'))}</td><td>${money(x.fee)}</td></tr>`).join('');$('invoiceTotal').textContent='合計：'+money(rows.reduce((a,x)=>a+Number(x.fee||0),0))}function download(filename,body,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('智哥通運_資料備份.json',JSON.stringify(data,null,2),'application/json')}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.customers)||!Array.isArray(d.drivers)||!Array.isArray(d.trips))throw Error();if(confirm('匯入將取代目前全部資料，確定？')){data=d;persist()}}catch{alert('備份檔格式不正確')}};r.readAsText(f)}function exportInvoice(){const rows=[['項次','日期','噸數','運送廠商／地點','金額'],...invoiceData().map((x,i)=>[i+1,x.date,x.tons,[x.vendor,x.place].filter(Boolean).join('／'),x.fee])];download('智哥通運_請款單.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}render();</script></body></html>
